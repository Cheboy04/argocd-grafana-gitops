apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Cheboy04/argocd-grafana-gitops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: grafana
      jsonPointers:
        - /spec/replicas
